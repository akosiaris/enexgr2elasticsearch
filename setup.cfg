[metadata]
name = enexgr2elasticsearch
version = 0.0.1
description = A tool to populate elasticsearch indices from Hellenic Energy exchange group data
long_description = file: README.md
keywords = enex, power, electricity, hellenic, greek
license = GNU Affero Public License v3
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Developers
    Intended Audience :: Financial and Insurance Industry
    License :: OSI Approved :: GNU Affero Public License v3 (GPLv3)
    Operating System :: POSIX
    Programming Language :: Python :: 3
    Topic :: Utilities

[options]
packages = enexgr2elasticsearch
install_requires =
    ecs-logging
    openpyxl
    pytz
    requests
    structlog
    importlib-metadata; python_version < "3.10"
include_package_data = True

[options.entry_points]
console_scripts =
    enexgr2elasticsearch = enexgr2elasticsearch.main:main
