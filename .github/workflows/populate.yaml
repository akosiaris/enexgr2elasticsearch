# This workflow will install Python dependencies and populate an endpoint

name: Populate Endpoints

on:
  push:
    paths:
      - .github/workflows/populate.yml # Only run a new workflow every time this file (flat.yaml) file changes
  workflow_dispatch: # Required even though this is currently empty
  schedule:
    - cron: '0 9,12,13,21 * * *' # Run 4 per day

permissions:
  contents: read

jobs:
  scheduled:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
    - name: Populate elasticsearch endpoint
      env:
        ENDPOINT: ${{ secrets.ENDPOINT }}
        APIKEY: ${{ secrets.APIKEY }}
      run: python3 enexgr2elasticsearch/main.py -H $ENDPOINT --api-key $APIKEY
